# Milvus 后端叠加层。**只在需要 Milvus 时才加载**：
#
#   # 情形 A：机器上已经有 Milvus 在跑（比如别的项目起的），只是让 PaperNest 连过去
#   docker compose -f docker-compose.yml -f docker-compose.milvus.yml up -d
#
#   # 情形 B：还需要自带一套 Milvus（多起 3 个容器、约 2GB 镜像、2~4GB 内存）
#   docker compose -f docker-compose.yml -f docker-compose.milvus.yml --profile own-milvus up -d
#
# 为什么默认只连不起：本机实测常见的情况是**已经有一个 Milvus 在 19530 上**
# （开发机上另一个项目起的），这时再起一套只会端口冲突。所以自带的那套放在
# `own-milvus` profile 后面，要才给。
#
# 为什么这些不并进主 compose：默认后端是 numpy（1200 条向量下 8.5ms/次，且是**精确**检索），
# Chroma 后端更是嵌入式、连容器都不用加。让不用 Milvus 的人白付 3 个容器没道理。
#
# 三个后端的实测对照（真实库 451 条向量 · 30 次查询 · top-5，数字见 README）：
#   numpy   0 容器 ·   8.5 ms/次 · 精确 kNN，无召回损失
#   chroma  0 容器 ·   6.8 ms/次 · HNSW 近似，与精确检索 top-5 一致 39/40
#   milvus  1~3 容器 · 20.1 ms/次 · HNSW，与精确检索 top-5 一致 **30/30**
#
# ⚠ Windows 上没有轻量选项：Milvus Lite（嵌入式）全部历史版本**零个 Windows wheel**，
#   `pip install pymilvus[milvus_lite]` 在 Windows 上会静默跳过。只能连服务端。

services:
  papernest:
    environment:
      PAPERNEST_VECTOR_BACKEND: milvus
      # host.docker.internal = 宿主机。连"外部已有的 Milvus"走这个（已实测打通）；
      # 若用下面 own-milvus profile 自带的那套，改成 http://milvus:19530 走 compose 内网。
      PAPERNEST_MILVUS_URI: ${PAPERNEST_MILVUS_URI:-http://host.docker.internal:19530}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 上没有这条就解析不到宿主机

  # ── 以下三个只在 --profile own-milvus 时启动 ──

  milvus-etcd:
    profiles: ["own-milvus"]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: papernest-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/milvus/etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    profiles: ["own-milvus"]
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: papernest-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["own-milvus"]
    image: milvusdb/milvus:v2.5.10
    container_name: papernest-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ./data/milvus/db:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s        # 冷启动慢，给不够会被误判不健康（实测要一分钟以上）
      timeout: 20s
      retries: 3
    ports:
      - "19531:19530"          # 错开 19530，避免与机器上已有的 Milvus 撞端口
      - "9092:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
